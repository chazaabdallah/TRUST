<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TRUST — Login</title>

    <link rel="stylesheet" href="css/admin.css">

</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <p class="eyebrow">
                TRUST
            </p>

            <h1>
                Login
            </h1>

            <p class="login-description">
                Sign in to your TRUST account.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>


                <p id="loginMessage"></p>

            </form>


            <p>
                Don't have an account?
                <a href="/register.html">
                    Create one
                </a>
            </p>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
