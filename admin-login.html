<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRUST — Admin Login</title>

    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <p class="eyebrow">
                TRUST — INTERNAL
            </p>

            <h1>Admin Login</h1>

            <p class="login-description">
                Sign in to manage website content.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Sign In
                </button>

                <p id="loginMessage"></p>

            </form>

        </section>

    </main>


    <script src="js/admin-login.js"></script>

</body>
</html>
