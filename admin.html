<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRUST — Content Management</title>

    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <header class="admin-header">

        <div>
            <p class="eyebrow">TRUST — INTERNAL</p>
            <h1>Content Management</h1>
        </div>

        <button id="logoutBtn" class="logout-btn">
            Logout
        </button>

    </header>


    <main class="admin-container">

        <!-- ADD / EDIT FORM -->

        <section class="content-form-section">

            <div class="section-heading">

                <p class="eyebrow">
                    MANAGE CONTENT
                </p>

                <h2 id="formTitle">
                    Add New Content
                </h2>

            </div>


            <form id="contentForm">

                <div class="form-group">

                    <label for="title">
                        Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Enter content title"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <input
                        type="text"
                        id="category"
                        placeholder="e.g. Education"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="5"
                        placeholder="Enter content description"
                        required
                    ></textarea>

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        id="saveBtn"
                    >
                        Add Content
                    </button>

                    <button
                        type="button"
                        id="cancelBtn"
                        class="cancel-btn"
                        hidden
                    >
                        Cancel
                    </button>

                </div>


                <p id="formMessage"></p>

            </form>

        </section>


        <!-- EXISTING CONTENT -->

        <section class="content-list-section">

            <div class="section-heading">

                <p class="eyebrow">
                    DATABASE CONTENT
                </p>

                <h2>
                    Existing Content
                </h2>

            </div>


            <div id="contentList">

                <p class="loading">
                    Loading content...
                </p>

            </div>

        </section>
        <section class="admin-section">

    <div class="section-header">
        <div>
            <span class="section-label">SERVICE MANAGEMENT</span>
            <h2>Company Services</h2>
            <p>
                Create, update and manage the services offered by TRUST.
            </p>
        </div>
    </div>

    <form id="serviceForm" class="admin-form">

        <input
            type="hidden"
            id="serviceId"
        >

        <div class="form-group">
            <label for="serviceName">
                Service Name
            </label>

            <input
                type="text"
                id="serviceName"
                placeholder="e.g. Message Analysis"
                required
            >
        </div>

        <div class="form-group">
            <label for="serviceCategory">
                Category
            </label>

            <input
                type="text"
                id="serviceCategory"
                placeholder="e.g. Security"
                required
            >
        </div>

        <div class="form-group">
            <label for="serviceDescription">
                Description
            </label>

            <textarea
                id="serviceDescription"
                rows="4"
                placeholder="Describe the service..."
                required
            ></textarea>
        </div>

        <div class="form-actions">

            <button
                type="submit"
                class="primary-btn"
                id="serviceSubmitBtn"
            >
                Add Service
            </button>

            <button
                type="button"
                class="secondary-btn"
                id="cancelServiceEdit"
                style="display:none;"
            >
                Cancel
            </button>

        </div>

        <p id="serviceMessage"></p>

    </form>

    <div class="services-management">

        <div class="section-header">
            <h3>Existing Services</h3>
        </div>

        <div
            id="servicesList"
            class="services-list"
        ></div>

    </div>

</section>

    </main>


    <script src="js/admin.js"></script>

</body>
</html>
